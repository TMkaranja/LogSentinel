[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "0.1.0"
description = "Defensive, file-based log analysis CLI (Python standard library only)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
logsentinel = "logsentinel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
